spring.application.name=healthcare-connector

# Database configuration
spring.datasource.url=jdbc:h2:mem:healthcare;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server settings
server.port=8080
spring.main.allow-circular-references=true

# AI Copilot — Gemini free API
# Put real key in application-local.properties (or env GEMINI_API_KEY)
# Get/rotate key: https://aistudio.google.com/apikey
spring.profiles.active=local
app.ai.provider=gemini
app.ai.gemini.api-key=${GEMINI_API_KEY:change-me}
app.ai.gemini.api-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
app.ai.gemini.fallback-models=gemini-3.1-flash-lite,gemini-flash-latest,gemini-3-flash-preview
app.ai.openai.api-key=${OPENAI_API_KEY:change-me}
app.ai.openai.api-url=https://api.openai.com/v1/chat/completions
app.ai.openai.model=gpt-4o-mini

# JWT settings
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# CORS settings
app.cors.allowed-origins=http://localhost:4200

# WebSocket settings
websocket.endpoint=/ws
websocket.topic-prefix=/topic
websocket.app-prefix=/app

# API documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Mail settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=change-me@example.com
spring.mail.password=change-me
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.healthconn=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
