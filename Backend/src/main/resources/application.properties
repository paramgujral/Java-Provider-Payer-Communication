server.port=8080
spring.application.name=smart-healthcare-connector

# H2 Database
spring.datasource.url=jdbc:h2:mem:smarthealthcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=H2sa
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=smart-healthcare-connector-jwt-secret-key-2026-very-long-secret
app.jwt.expiration=86400000

# FHIR
fhir.server.base-url=https://hapi.fhir.org/baseR4

# AI Copilot
#ai.copilot.provider=ollama
#ai.copilot.ollama.base-url=http://localhost:11434
#ai.copilot.ollama.model=mistral

# ─── AI Copilot ───────────────────────────────────────────────────────────────
# Provider options:
#   "groq"   → Llama 3.1 8B via Groq Cloud (recommended — 1-3s, free, open-source)
#   "ollama" → Local model via Ollama (offline, no API key, slower on CPU)
ai.copilot.provider=groq

# ── Groq (Llama 3.1 8B — recommended) ────────────────────────────────────────
# Get your free API key from https://console.groq.com → API Keys → Create Key
# Free tier: 14,400 requests/day — no credit card required
ai.copilot.groq.base-url=https://api.groq.com/openai/v1
ai.copilot.groq.api-key=gsk_your_key_here
ai.copilot.groq.model=llama-3.1-8b-instant

# ── Ollama (Local — optional fallback) ───────────────────────────────────────
# Requires Ollama installed on your system: https://ollama.com
# Setup: ollama pull mistral && ollama serve
# To use: change ai.copilot.provider=ollama
ai.copilot.ollama.base-url=http://localhost:11434
ai.copilot.ollama.model=mistral

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# WebSocket
spring.websocket.enabled=true

# Logging
logging.level.com.healthcare.connector=DEBUG
logging.level.org.springframework.security=WARN

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# Jackson
spring.jackson.default-property-inclusion=non_null