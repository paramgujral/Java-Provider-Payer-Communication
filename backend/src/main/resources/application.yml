spring:
  application:
    name: Smart-Healthcare-Connector
  datasource:
    url: jdbc:mysql://localhost:3306/healthconnector?useSSL=false&serverTimezone=UTC
    username: root
    password: pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
