server:
  port: 8081

spring:
  application:
    name: smart-auth-connector

  # ---- Default: H2 in-memory (zero setup). The app runs immediately. ----
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true          # browse the SQL DB at http://localhost:8081/h2-console
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none         # we own the schema via schema.sql
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always           # run schema.sql + data.sql on startup
      platform: h2

  # ---- MySQL (uncomment, and uncomment the driver in pom.xml) ----
  #  datasource:
  #    url: jdbc:mysql://localhost:3306/authdb?createDatabaseIfNotExist=true&serverTimezone=UTC
  #    username: root
  #    password: yourpassword
  #  jpa:
  #    database-platform: org.hibernate.dialect.MySQLDialect
  #  sql:
  #    init:
  #      platform: mysql

  # ---- PostgreSQL (uncomment, and uncomment the driver in pom.xml) ----
  #  datasource:
  #    url: jdbc:postgresql://localhost:5432/authdb
  #    username: postgres
  #    password: yourpassword
  #  jpa:
  #    database-platform: org.hibernate.dialect.PostgreSQLDialect
  #  sql:
  #    init:
  #      platform: postgresql

# ---- AI Copilot configuration ----
# If an API key is present the Copilot calls a live LLM; otherwise it transparently
# falls back to the built-in clinical rules engine (so the platform always works).
copilot:
  provider: anthropic
  api-url: https://api.anthropic.com/v1/messages
  api-version: "2023-06-01"
  model: claude-sonnet-4-20250514
  api-key: ${ANTHROPIC_API_KEY:}     # export ANTHROPIC_API_KEY=sk-... to enable live AI
  timeout-seconds: 30

# Allow the Angular dev server to call the API
cors:
  allowed-origins: http://localhost:4200

logging:
  level:
    com.connector.auth: DEBUG
