<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h3 class="text-center mb-4">Register</h3>
      <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" [(ngModel)]="username" name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" required>
        </div>
        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <select class="form-select" id="role" [(ngModel)]="role" name="role" required>
            <option value="PROVIDER">Provider</option>
            <option value="PAYER">Payer</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="entityId" class="form-label">Entity ID (Provider ID or Payer ID)</label>
          <input type="number" class="form-control" id="entityId" [(ngModel)]="entityId" name="entityId" required>
        </div>

        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <button type="submit" class="btn btn-success w-100" [disabled]="registerForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Register
        </button>
      </form>
      <div class="mt-3 text-center">
        <small>Already have an account? <a routerLink="/login">Login</a></small>
      </div>
    </div>
  </div>
</div>
