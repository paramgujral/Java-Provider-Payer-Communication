# Server
server.port=8080

# H2 Database
spring.datasource.url=jdbc:h2:mem:healthcaredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize data
spring.sql.init.mode=always

# AI Copilot - Anthropic Claude API
ai.copilot.api.url=https://api.anthropic.com/v1/messages
ai.copilot.api.key=YOUR_ANTHROPIC_API_KEY
ai.copilot.model=claude-sonnet-4-20250514

# CORS
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.com.healthcare=DEBUG


openai.api.key=YOUR_OPENAI_API_KEY
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini