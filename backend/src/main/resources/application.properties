spring.application.name=HealthConnectAI

# H2 Database
spring.datasource.url=jdbc:h2:mem:healthconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=HealthConnectAI_SuperSecretKey_2024_MustBe256BitsLong_ForHMACSHA256
app.jwt.expiration-ms=86400000

# Server
server.port=8080

# CORS
app.cors.allowed-origins=http://localhost:4200

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
