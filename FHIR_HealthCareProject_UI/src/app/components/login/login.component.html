<div class="login-container animate-fade-in">
  <div class="login-card glass-panel">
    <div class="logo-area">
      <div class="icon-circle">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <h1>FHIR Auth Connector</h1>
      <p>Smart Bidirectional Healthcare Authorization</p>
    </div>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="e.g. provider@connector.com"
          [(ngModel)]="email" 
          required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••"
          [(ngModel)]="password" 
          required>
      </div>

      <button type="submit" class="btn btn-primary w-full" [disabled]="loading()">
        {{ loading() ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <div *ngIf="error()" class="error-alert">
      {{ error() }}
    </div>

    <div class="presets-section">
      <h3>Quick Login Presets</h3>
      <div class="presets-grid">
        <button class="btn btn-secondary text-xs" (click)="usePreset('provider@connector.com')">
          <span>Dr. Jenkins (Provider)</span>
        </button>
        <button class="btn btn-secondary text-xs" (click)="usePreset('payer@connector.com')">
          <span>Aetna Reviewer (Payer)</span>
        </button>
      </div>
    </div>
  </div>
</div>
