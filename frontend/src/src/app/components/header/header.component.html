
<header class="app-header">
  <div class="header-container">
    <div class="logo-section">
      <i class="pi pi-heart-fill logo-icon"></i>
      <span class="app-name">HealthCare Connect</span>
    </div>

    <div class="header-actions">
      <!-- Notifications -->
      <div class="notification-section" [class.show]="showNotificationsPanel">
        <button
          class="notification-btn"
          (click)="toggleNotifications()"
          [attr.aria-label]="'Notifications - ' + unreadCount + ' unread'"
        >
          <i class="pi pi-bell"></i>
          <span *ngIf="unreadCount > 0" class="notification-badge">{{ unreadCount }}</span>
        </button>

        <div *ngIf="showNotificationsPanel" class="notifications-panel">
          <div class="panel-header">
            <h3>Notifications</h3>
            <button (click)="clearAllNotifications()" class="clear-btn" pButton pRipple type="button">
              Clear All
            </button>
          </div>

          <div class="notifications-list">
            <div *ngIf="notifications.length === 0" class="empty-state">
              <i class="pi pi-inbox"></i>
              <p>No notifications</p>
            </div>

            <div *ngFor="let notification of notifications" class="notification-item" [class.unread]="!notification.read">
              <div class="notification-icon">
                <i [class]="'pi ' + getNotificationIcon(notification.type)"></i>
              </div>
              <div class="notification-content">
                <h4>{{ notification.title }}</h4>
                <p>{{ notification.message }}</p>
                <span class="notification-time">{{ notification.timestamp | date: 'short' }}</span>
              </div>
              <button
                *ngIf="!notification.read"
                class="mark-read-btn"
                (click)="markNotificationAsRead(notification.id)"
                pButton
                pRipple
                type="button"
              >
                <i class="pi pi-check"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- User Profile -->
      <div class="user-section">
        <div class="user-avatar">{{ currentUser && currentUser.username ? currentUser.username.charAt(0).toUpperCase() : 'U' }}</div>
        <span class="user-name">{{ currentUser?.username }}</span>

        <button pButton pRipple type="button" (click)="logout()" class="logout-btn" label="Logout">
          <i class="pi pi-sign-out"></i>
        </button>
      </div>
    </div>
  </div>
</header>
