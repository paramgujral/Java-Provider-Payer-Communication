# Application Configuration
spring.application.name=healthcare-connector
server.port=8080
spring.config.import=optional:file:.env[.properties]

# Database Configuration (supports local Postgres by default, easily overridden by NeonDB env variables)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/healthcare_connector}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload configurations
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=./uploads

# JWT Configurations (24-hour expiration)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Gemini API configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.api.temperature=0.3
gemini.api.max-tokens=2048

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Upstash Redis Configuration
redis.url=${UPSTASH_REDIS_REST_URL}
redis.token=${UPSTASH_REDIS_REST_TOKEN}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.url=${CLOUDINARY_URL}
