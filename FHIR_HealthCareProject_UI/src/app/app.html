<!-- Navigation Header -->
<header class="app-navbar glass-panel" *ngIf="auth.isLoggedIn()">
  <div class="nav-left">
    <a routerLink="/dashboard" class="brand-link">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
        </svg>
      </div>
      <span class="brand-name">FHIR Connector</span>
    </a>
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">Dashboard</a>
      <a *ngIf="auth.userRole() === 'ROLE_PROVIDER'" routerLink="/request/new" routerLinkActive="active" class="nav-item">New Request</a>
    </nav>
  </div>

  <div class="nav-right">
    <!-- Notification Bell -->
    <div class="notification-bell-container">
      <button class="icon-btn" (click)="toggleNotifications()" title="Notifications">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="bell-icon">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
        </svg>
        <span class="bell-badge" *ngIf="unreadCount() > 0">{{ unreadCount() }}</span>
      </button>

      <!-- Dropdown Card -->
      <div class="notifications-dropdown glass-panel animate-fade-in" *ngIf="showNotifications()">
        <div class="dropdown-header border-b">
          <h4>Notifications Center</h4>
          <span class="unread-lbl" *ngIf="unreadCount() > 0">{{ unreadCount() }} new</span>
        </div>
        <div class="dropdown-content">
          <div *ngIf="notifications().length === 0" class="no-notifs">
            No notifications yet.
          </div>
          <div 
            *ngFor="let n of notifications()" 
            class="notif-item" 
            [class.unread]="!n.isRead"
            (click)="onNotificationClick(n)">
            <p class="notif-msg">{{ n.message }}</p>
            <span class="notif-date">{{ n.createdAt | date:'short' }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- User Profile & Logout -->
    <div class="profile-box">
      <div class="profile-info">
        <span class="username">{{ auth.currentUser()?.name }}</span>
        <span class="userrole">{{ auth.currentUser()?.role === 'ROLE_PROVIDER' ? 'Provider' : 'Payer Reviewer' }}</span>
      </div>
      <button class="btn btn-secondary text-xs" (click)="logout()">
        Logout
      </button>
    </div>
  </div>
</header>

<!-- Main Application Screen Area -->
<main [class.main-logged]="auth.isLoggedIn()" class="app-main-content">
  <router-outlet></router-outlet>
</main>
