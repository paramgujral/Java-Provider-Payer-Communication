
<div class="home-container">
  <app-header></app-header>

  <div class="home-content">
    <div class="welcome-section">
      <h1>Welcome User</h1>
      <p>Review and manage authorization requests</p>
    </div>

    <div class="table-section">
      <div class="section-header">
        <h2>Authorization Requests</h2>
      </div>

      <p-table
        #dt
        [value]="requests"
        [rows]="10"
        [paginator]="true"
        [globalFilterFields]="['patientName', 'patientId']"
        [loading]="isLoading"
        responsiveLayout="scroll"
        [tableStyle]="{ 'min-width': '100%' }"
      >
        <ng-template pTemplate="caption">
          <div class="table-header">
            <span class="p-input-icon-left">
              <i class="pi pi-search"></i>
              <input
                pInputText
                type="text"
                #globalFilter
                (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                placeholder="Search requests..."
              />
            </span>
          </div>
        </ng-template>

        <ng-template pTemplate="header">
          <tr>
            <th pSortableColumn="id">S.No <p-sortIcon field="id"></p-sortIcon></th>
            <th pSortableColumn="patientName">
              Patient Name <p-sortIcon field="patientName"></p-sortIcon>
            </th>
            <th pSortableColumn="status">Status <p-sortIcon field="status"></p-sortIcon></th>
            <th pSortableColumn="lastUpdated">
              Last Updated <p-sortIcon field="lastUpdated"></p-sortIcon>
            </th>
            <th style="width: 120px">Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-request>
          <tr>
            <td>{{ request.id }}</td>
            <td>{{ request.patientName }}</td>
            <td>
              <p-tag
                [value]="request.status"
                [severity]="getStatusSeverity(request.status)"
              ></p-tag>
            </td>
            <td>{{ request.lastUpdated | date: 'MMM dd, yyyy' }}</td>
            <td>
              <div class="action-buttons">
                <button
                  pButton
                  pRipple
                  type="button"
                  icon="pi pi-eye"
                  (click)="preview(request)"
                  class="p-button-rounded p-button-sm p-button-info"
                  pTooltip="Preview"
                ></button>
                <button
                  pButton
                  pRipple
                  type="button"
                  icon="pi pi-comments"
                  (click)="initiateChat(request)"
                  class="p-button-rounded p-button-sm p-button-success"
                  pTooltip="Chat"
                ></button>
              </div>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="5" class="text-center py-4">
              <i class="pi pi-inbox text-gray-400" style="font-size: 32px"></i>
              <p class="text-gray-500">No authorization requests found</p>
            </td>
          </tr>
        </ng-template>

        <ng-template pTemplate="loadingbody">
          <tr>
            <td colspan="5">
              <p-skeleton height="40px"></p-skeleton>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
