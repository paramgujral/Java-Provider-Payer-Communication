# ===========================
# Server
# ===========================
server.port=8080

# ===========================
# PostgreSQL
# ===========================
spring.datasource.url=jdbc:postgresql://localhost:5432/healthcare_db
spring.datasource.username=postgres
spring.datasource.password=root

spring.datasource.driver-class-name=org.postgresql.Driver

# ===========================
# JPA
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===========================
# Swagger
# ===========================
springdoc.swagger-ui.path=/swagger-ui.html

# ===========================
# JWT
# ===========================
jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVm
jwt.expiration-ms=86400000



spring.ai.api-key=${GEMINI_API_KEY}
spring.ai.provider=gemini
spring.ai.chat.model=gemini-2.5-flash
spring.ai.gemini.auth-type=api-key