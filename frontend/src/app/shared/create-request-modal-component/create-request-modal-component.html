<div class="modal fade" id="createRequestModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Authorization Request</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
        <div class="mb-3">
          <label class="form-label">Patient ID</label>
          <input type="text" class="form-control" [(ngModel)]="patientId" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Service Type</label>
          <input type="text" class="form-control" [(ngModel)]="serviceType" placeholder="e.g., MRI">
        </div>
        <div class="mb-3">
          <label class="form-label">Payer ID</label>
          <input type="number" class="form-control" [(ngModel)]="payerId">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="create()" [disabled]="!patientId || !serviceType || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          Create
        </button>
      </div>
    </div>
  </div>
</div>
