# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/healthcare_connector?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
app.jwt.secret=HealthConnectAI_SuperSecret_JWT_Key_2024_FHIR_R4_Secure_256bit_Key!
app.jwt.expiration=86400000

# CORS
app.cors.allowed-origins=http://localhost:4200

# Logging
logging.level.com.healthcare.connector=INFO
logging.level.org.springframework.security=WARN

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
