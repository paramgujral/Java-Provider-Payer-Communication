# ===========================================
# HealthConnect Application Configuration
# ===========================================

spring.application.name=healthconnect-backend
server.port=8080

# ---- Database (H2 in-memory for dev; switch to Postgres for prod) ----
spring.datasource.url=jdbc:h2:mem:healthconnect;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Enable H2 console at /h2-console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- For Production Postgres, uncomment and configure ----
# spring.datasource.url=jdbc:postgresql://localhost:5432/healthconnect
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT Configuration ----
app.jwt.secret=ChangeThisToALongRandomSecretKeyForProductionUse1234567890ABCDEF
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:3000

# ---- Logging ----
logging.level.com.healthconnect=INFO
