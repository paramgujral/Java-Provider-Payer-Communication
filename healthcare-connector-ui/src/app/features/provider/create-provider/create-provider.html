<div class="container mt-4">

    <h2>Create Provider</h2>

    <div class="mb-3">

        <label>Provider Name</label>

        <input
            type="text"
            class="form-control"
            [(ngModel)]="providerName">

    </div>

    <div class="mb-3">

        <label>Email</label>

        <input
            type="email"
            class="form-control"
            [(ngModel)]="email">

    </div>

    <div class="mb-3">

        <label>Phone Number</label>

        <input
            type="text"
            class="form-control"
            [(ngModel)]="phoneNumber">

    </div>

    <div class="mb-3">

        <label>Address</label>

        <input
            type="text"
            class="form-control"
            [(ngModel)]="address">

    </div>

    <button
        class="btn btn-primary"
        (click)="saveProvider()">

        Save

    </button>

</div>
