server:
  port: 8082

spring:
  application:
    name: payer-service
  datasource:
    url: jdbc:h2:mem:payerdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8081}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.healthconnect: INFO
