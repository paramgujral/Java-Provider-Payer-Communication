<div class="modal-backdrop" *ngIf="isVisible && user" (click)="onClose()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-header d-flex justify-between align-center">
      <h3>User Profile</h3>
      <button class="btn-icon" (click)="onClose()">✖</button>
    </div>
    <div class="modal-body text-center p-8">
      <div class="profile-avatar mb-4 mx-auto">
        {{ user.avatarInitials }}
      </div>
      <h2 class="mb-1">{{ user.name }}</h2>
      <p class="text-gray-500 mb-4">{{ user.email || 'Email not available' }}</p>
      
      <div class="profile-details">
        <div class="detail-row">
          <span class="detail-label">Role</span>
          <span class="role-pill" [ngClass]="'role-' + user.role.toLowerCase()">{{ user.role | titlecase }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Organization ID</span>
          <span class="font-medium">{{ user.organizationId }}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Status</span>
          <span class="status-pill" [ngClass]="user.active ? 'status-active' : 'status-inactive'">
            {{ user.active ? 'Active' : 'Inactive' }}
          </span>
        </div>
        <div class="detail-row" *ngIf="user.id && user.id !== user.organizationId">
          <span class="detail-label">User ID</span>
          <span class="text-gray-500">{{ user.id }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
