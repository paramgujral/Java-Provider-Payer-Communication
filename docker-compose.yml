services:
  payer:
    build:
      context: .
      dockerfile: docker/payer.Dockerfile
    ports:
      - "8082:8082"
    environment:
      PROVIDER_BASE_URL: http://provider:8081
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173

  provider:
    build:
      context: .
      dockerfile: docker/provider.Dockerfile
    ports:
      - "8081:8081"
    environment:
      PAYER_BASE_URL: http://payer:8082
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      # Optional: activates the Claude-powered copilot advisor
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      - payer

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - provider
      - payer
