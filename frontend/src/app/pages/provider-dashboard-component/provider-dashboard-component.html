<div class="container-fluid p-0">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="bi bi-hdd-stack"></i> Provider Dashboard</span>
      <div class="d-flex">
        <span class="navbar-text text-white me-3">{{ auth.user$ | async }} (Provider)</span>
        <button class="btn btn-outline-light" (click)="auth.logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
      <h4 class="mb-2">My Authorization Requests</h4>
      <button class="btn btn-primary" (click)="openCreateModal()">
        <i class="bi bi-plus-circle"></i> New Request
      </button>
    </div>

    <app-create-request-modal (created)="loadRequests()"></app-create-request-modal>
    <app-ai-review-modal></app-ai-review-modal>

    <div *ngIf="loading" class="text-center my-5">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Patient</th>
            <th>Service</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let req of requests">
            <td>{{ req.id }}</td>
            <td>{{ req.patientId }}</td>
            <td>{{ req.serviceType }}</td>
            <td><span class="badge {{ getStatusBadge(req.status) }}">{{ req.status }}</span></td>
            <td>{{ req.createdAt | date:'short' }}</td>
            <td>
              <button *ngIf="req.status === 'PENDING'" class="btn btn-sm btn-success me-1" (click)="submitRequest(req.id)">
                Submit
              </button>
              <button class="btn btn-sm btn-info" (click)="viewAiReview(req.id)">
                <i class="bi bi-robot"></i> AI Review
              </button>
            </td>
          </tr>
          <tr *ngIf="requests.length === 0">
            <td colspan="6" class="text-center text-muted py-4">No requests yet.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
