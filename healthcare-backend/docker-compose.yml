version: "3.8"

services:
  service-registry:
    build: ./service-registry
    ports:
      - "8761:8761"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - service-registry

  auth-service:
    build: ./auth-service
    ports:
      - "8086:8086"
    depends_on:
      - service-registry

  provider-service:
    build: ./provider-service
    ports:
      - "8081:8081"
    depends_on:
      - service-registry

  payer-service:
    build: ./payer-service
    ports:
      - "8082:8082"
    depends_on:
      - service-registry

  authorization-service:
    build: ./authorization-service
    ports:
      - "8083:8083"
    depends_on:
      - service-registry

  ai-copilot-service:
    build: ./ai-copilot-service
    ports:
      - "8084:8084"
    depends_on:
      - service-registry

  notification-service:
    build: ./notification-service
    ports:
      - "8085:8085"
    depends_on:
      - service-registry
