<header class="bg-white shadow-sm border-b fixed top-0 left-0 right-0 z-50">

  <div class="max-w-screen-2xl mx-auto px-4 lg:px-6">

    <div class="flex items-center justify-between h-16">

      <!-- Left -->
      <div class="flex items-center gap-3">

        <button
          class="md:hidden p-2 rounded-lg hover:bg-gray-100"
          (click)="toggleSidebar($event)">

          <svg class="w-6 h-6 text-gray-600"
               fill="none"
               stroke="currentColor"
               viewBox="0 0 24 24">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"/>

          </svg>

        </button>

        <a
          routerLink="/"
          class="flex items-center gap-3">

          <div
            class="w-10 h-10 rounded-xl bg-indigo-600 text-white flex items-center justify-center">

            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 12h3m-3 3h5m-5-6h6m3 10H6a2 2 0 01-2-2V6a2 2 0 012-2h8l4 4v10a2 2 0 01-2 2z"/>

            </svg>

          </div>

          <div>

            <div class="font-semibold text-gray-800">

              Healthcare AI

            </div>

            <div class="text-xs text-gray-500">

              @if(role==='PROVIDER'){
                Provider Portal
              }
              @else if(role==='PAYER'){
                Payer Portal
              }
              @else if(role==='ADMIN'){
                Admin Portal
              }
              @else{
                Prior Authorization Platform
              }

            </div>

          </div>

        </a>

      </div>

      <!-- Right -->

      <div class="flex items-center gap-4">

        <app-notification-bell></app-notification-bell>

        <div class="h-6 border-l"></div>

        <div class="flex items-center gap-3">

          <div
            class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-700 font-semibold flex items-center justify-center">

            {{ (fullName || 'U').charAt(0).toUpperCase() }}

          </div>

          <div class="hidden sm:block">

            <div class="font-medium text-gray-800">

              {{ fullName || 'User' }}

            </div>

            <div class="text-xs text-gray-500">

              {{ role }}

            </div>

          </div>

        </div>

        <button
          (click)="logout()"
          class="px-4 py-2 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition flex items-center gap-2">

          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H9m4 8H5a2 2 0 01-2-2V6a2 2 0 012-2h8"/>

          </svg>

          <span class="hidden sm:block">

            Logout

          </span>

        </button>

      </div>

    </div>

  </div>

</header>
