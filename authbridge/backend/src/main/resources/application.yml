spring:
  application:
    name: authbridge-backend
  profiles:
    active: dev

  # Default (dev/demo) datasource: in-memory H2, zero external infra.
  datasource:
    url: jdbc:h2:mem:authbridge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# Production profile: PostgreSQL + Flyway migrations + strict JPA.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authbridge}
    username: ${DB_USER:authbridge}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

# OAuth2/OIDC resource-server config (enable spring-boot-starter-oauth2-resource-server):
# spring.security.oauth2.resourceserver.jwt.issuer-uri: ${OIDC_ISSUER}
