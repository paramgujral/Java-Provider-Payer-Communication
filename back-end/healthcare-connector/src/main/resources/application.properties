spring.application.name=healthcare-connector

# ==========================================================
# Database Configuration
# ==========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/healthcare?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=DB Password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================================
# JPA / Hibernate
# ==========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# Server
# ==========================================================

server.port=8080
spring.main.allow-circular-references=true

# ==========================================================
# JWT Configuration
# ==========================================================

app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ==========================================================
# OpenAI Configuration
# ==========================================================

openai.api.key=OPEN API KEY

# ==========================================================
# AI Copilot
# ==========================================================

app.ai.provider=claude

app.ai.claude.api-key=your-claude-api-key-here
app.ai.claude.api-url=https://api.anthropic.com/v1/messages
app.ai.claude.model=claude-3-5-haiku-20241022
app.ai.claude.max-tokens=1024

app.ai.openai.api-key=your-openai-api-key-here
app.ai.openai.api-url=https://api.openai.com/v1/chat/completions
app.ai.openai.model=gpt-4o-mini

# ==========================================================
# CORS
# ==========================================================

app.cors.allowed-origins=http://localhost:4200

# ==========================================================
# WebSocket
# ==========================================================

websocket.endpoint=/ws
websocket.topic-prefix=/topic
websocket.app-prefix=/app

# ==========================================================
# Swagger
# ==========================================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==========================================================
# Mail Configuration
# ==========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================================================
# Logging
# ==========================================================

logging.level.com.healthconn=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE