server:
  port: 8081

spring:
  application:
    name: provider-service
  datasource:
    url: jdbc:h2:mem:providerdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

payer:
  base-url: ${PAYER_BASE_URL:http://localhost:8082}

copilot:
  claude:
    # optional — enables the Claude advisor
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-4-8

demo:
  seed: ${DEMO_SEED:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:8090}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.healthconnect: INFO
