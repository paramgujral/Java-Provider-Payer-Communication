version: '3.8'

services:
  # Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: fhir-connector-db
    environment:
      MYSQL_DATABASE: fhir_auth_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./FHIR_HealthCareProject_database_Analysis/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: ./FHIR_HealthCareProject_Backend_Services
      dockerfile: Dockerfile
    container_name: fhir-connector-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/fhir_auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy

  # Angular Frontend Service
  frontend:
    build:
      context: ./FHIR_HealthCareProject_UI
      dockerfile: Dockerfile
    container_name: fhir-connector-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mysql_data:
