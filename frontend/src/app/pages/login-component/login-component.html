<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow" style="max-width: 400px; width: 100%;">
    <div class="card-body p-4">
      <h2 class="text-center mb-4">
        <i class="bi bi-heart-pulse text-primary"></i> Healthcare Connector
      </h2>
      <p class="text-muted text-center">Provider & Payer Authorization Platform</p>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <input type="text" class="form-control" id="username" [(ngModel)]="username" name="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" required>
        </div>

        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
          Login
        </button>
      </form>

      <div class="mt-3 text-center">
        <small>Don't have an account? <a routerLink="/register">Register here</a></small>
      </div>
    </div>
  </div>
</div>
