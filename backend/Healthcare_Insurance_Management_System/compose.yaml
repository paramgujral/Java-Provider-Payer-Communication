services:
  postgres:
    image: 'postgres:16'
    container_name: health_insurance_postgres
    environment:
      - 'POSTGRES_DB=health_insurance_db'
      - 'POSTGRES_USER=postgres'
      - 'POSTGRES_PASSWORD=postgres'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
