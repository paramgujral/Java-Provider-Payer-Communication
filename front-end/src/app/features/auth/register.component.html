<div class="auth-shell">
  <div class="brand-panel">
    <div class="brand-inner">
      <h1 class="brand-title">Prior Authorization Platform</h1>
      <h2 class="brand-subtitle">Healthcare Provider &amp; Payer Portal</h2>
    </div>
  </div>

  <div class="form-panel">
    <mat-card class="register-card">
      <h1 class="register-title">Create Account</h1>

      <form [formGroup]="registerForm" (ngSubmit)="handleRegister()" class="register-form">
        <div class="field-group">
          <label for="firstName">First Name</label>
          <input id="firstName" type="text" formControlName="firstName" class="register-input" />
          <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched" class="field-error">
            First name is required
          </div>
        </div>

        <div class="field-group">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" class="register-input" />
          <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched" class="field-error">
            Last name is required
          </div>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" type="email" formControlName="email" class="register-input" />
          <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched" class="field-error">
            A valid email is required
          </div>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" type="password" formControlName="password" class="register-input" />
          <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="field-error">
            Password must be at least 6 characters
          </div>
        </div>

        <div class="field-group">
          <label for="role">Role</label>
          <select id="role" formControlName="role" class="register-input">
            <option value="PROVIDER">Provider</option>
            <option value="PAYER">Payer</option>
          </select>
          <div *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched" class="field-error">
            Role is required
          </div>
        </div>

        <div *ngIf="errorMessage" class="form-error-banner">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="form-success-banner">{{ successMessage }}</div>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading" class="register-btn">
          {{ loading ? 'Registering...' : 'Register' }}
        </button>
      </form>

      <p class="login-hint">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>
    </mat-card>
  </div>
</div>
